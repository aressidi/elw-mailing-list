services:
  # Backend API service
  - type: web
    name: elw-mailing-list-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set this in Render dashboard
      - key: CLIENT_URL
        value: https://elw-mailing-list.vercel.app
      - key: PORT
        value: 10000
      - key: AUTH_ENABLED
        value: 'true'
      - key: AUTH_USERNAME
        value: admin
      - key: AUTH_PASSWORD
        sync: false  # Set this in Render dashboard
      - key: AUTH_JWT_SECRET
        sync: false  # Set this in Render dashboard
    healthCheckPath: /api/health